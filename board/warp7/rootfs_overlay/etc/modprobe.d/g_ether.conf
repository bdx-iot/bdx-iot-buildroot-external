# Fixed, locally administered MAC addresses: g_ether picks random ones at each
# boot otherwise, so the host interface name (enx<host_addr>) and its
# NetworkManager profile would change on every reboot.
# dev_addr: usb0 on the WaRP7, host_addr: interface seen by the PC.
options g_ether dev_addr=02:00:00:00:77:01 host_addr=02:00:00:00:77:02
